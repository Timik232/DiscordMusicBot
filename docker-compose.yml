services:
  vault-agent:
    image: hashicorp/vault:2.0.4
    container_name: newdiscord-vault-agent
    restart: unless-stopped
    user: "0:0"
    environment:
      - SKIP_SETCAP=1
      - HOME=/tmp
      - VAULT_ADDR=http://vault:8200
    networks:
      - secrets-net
    volumes:
      - ./vault/agent.hcl:/etc/vault/agent.hcl:ro
      - ./vault/secrets.env.tmpl:/etc/vault/secrets.env.tmpl:ro
      - ./vault/role-id:/etc/vault/role-id:ro
      - ./vault/secret-id:/etc/vault/secret-id:ro
      - ./vault/secrets:/etc/vault/secrets
    command: agent -config=/etc/vault/agent.hcl

  discord-music-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-music-bot
    restart: unless-stopped
    network_mode: host
    depends_on:
      - vault-agent
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for vault secrets..."
        until [ -f /etc/vault/secrets/secrets.env ]; do
          sleep 0.5
        done
        echo "Loading secrets from vault..."
        . /etc/vault/secrets/secrets.env
        echo "Starting bot..."
        exec npx tsx src/main.ts
    environment:
      - PREFIX=${PREFIX:-/}
      - PIPE_MODE_MAX_TIME=${PIPE_MODE_MAX_TIME:-10}
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
      - ./vault/secrets:/etc/vault/secrets:ro
      # Маршрут YouTube-трафика (см. git-log 2026-09-02/09-11): yt-dlp читает этот
      # конфиг при каждом запуске. Переключение прокси/напрямую — переписыванием
      # файла на хосте (делает ~/bin/discordbot-healthcheck.sh), рестарт не нужен.
      # Discord-трафик идёт напрямую всегда и этого конфига не видит.
      - ./yt-dlp.conf:/root/.config/yt-dlp/config:ro

networks:
  secrets-net:
    external: true
